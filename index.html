<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Propose Day 💍</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #ffdde1;
      position: relative;
    }

    /* ---------- Login Page ---------- */
    .login {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      text-align: center;
      z-index: 5;
    }

    .login input {
      display: block;
      width: 220px;
      padding: 10px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    .login button {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      background: #ff4081;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #error {
      color: red;
      font-size: 14px;
      display: none;
    }

    /* ---------- Floating hearts ---------- */
    .hearts {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      display: none;
    }

    .heart {
      position: absolute;
      bottom: -20px;
      font-size: 24px;
      animation: floatUp linear infinite;
      opacity: 0.8;
    }

    @keyframes floatUp {
      from { transform: translateY(0) scale(1); opacity: .9; }
      to { transform: translateY(-110vh) scale(1.4); opacity: 0; }
    }

    /* ---------- Proposal Card ---------- */
    .card {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      text-align: center;
      width: 320px;
      position: relative;
      z-index: 2;
      display: none;
    }

    h1 { margin-bottom: 30px; color: #e91e63; }

    .buttons { position: relative; height: 130px; }

    /* Smaller Heart Button */
    #yesBtn {
      width: 70px;
      height: 70px;
      border: none;
      cursor: pointer;
      color: white;
      background: #ff2e63;
      position: absolute;
      left: 40px;
      top: 30px;
      transform: rotate(-45deg);
    }

    #yesBtn::before,
    #yesBtn::after {
      content: "";
      position: absolute;
      width: 70px;
      height: 70px;
      background: #ff2e63;
      border-radius: 50%;
    }

    #yesBtn::before { top: -35px; left: 0; }
    #yesBtn::after { left: 35px; top: 0; }

    #yesBtn span {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: rotate(45deg);
      font-size: 14px;
      font-weight: bold;
      z-index: 1;
    }

    #message {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
      color: #e91e63;
      display: none;
    }

    #fireworks {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }
  </style>
</head>
<body>

  <!-- Login -->
  <div class="login" id="loginBox">
    <h2>Enter to continue 💖</h2>
    <input id="user" placeholder="Username">
    <input id="pass" type="password" placeholder="Password">
    <button onclick="checkLogin()">Enter</button>
    <div id="error">Wrong username or password</div>
  </div>

  <!-- Hearts -->
  <div class="hearts" id="hearts"></div>

  <canvas id="fireworks"></canvas>
  <audio id="boomSound" src="https://actions.google.com/sounds/v1/explosions/fireworks.ogg"></audio>

  <!-- Proposal -->
  <div class="card" id="proposal">
    <h1>Will you be my Kanchi? ❤️</h1>
    <div class="buttons" id="btnArea">
      <button id="yesBtn"><span>Yes</span></button>
    </div>
    <div id="message">Yay!! I knew it 😍<br>I lob you too ❤️</div>
  </div>

<script>
/* -------- Login Logic -------- */
function checkLogin(){
  const u = document.getElementById('user').value.trim().toLowerCase();
  const p = document.getElementById('pass').value.trim().toLowerCase();
  if(u === 'kanchi' && p === 'love'){
    document.getElementById('loginBox').style.display='none';
    document.getElementById('proposal').style.display='block';
    document.getElementById('hearts').style.display='block';
    startHearts();
    startYesMovement();
  } else {
    document.getElementById('error').style.display='block';
  }
}

/* -------- Hearts -------- */
const heartsWrap = document.getElementById('hearts');
function startHearts(){
  setInterval(()=>{
    const h=document.createElement('div');
    h.className='heart';
    h.textContent=Math.random()>0.5?'❤️':'💖';
    h.style.left=Math.random()*100+'vw';
    h.style.animationDuration=(4+Math.random()*4)+'s';
    heartsWrap.appendChild(h);
    setTimeout(()=>h.remove(),8000);
  },300);
}

/* -------- Yes Button Movement -------- */
const yesBtn=document.getElementById('yesBtn');
const area=document.getElementById('btnArea');
const message=document.getElementById('message');
let moving=true;

function moveYes(){
  if(!moving) return;
  const r=area.getBoundingClientRect();
  const b=yesBtn.getBoundingClientRect();
  yesBtn.style.left=Math.random()*(r.width-b.width)+'px';
  yesBtn.style.top=Math.random()*(r.height-b.height)+'px';
}

function startYesMovement(){
  const mover=setInterval(moveYes,300);
  setTimeout(()=>{
    moving=false;
    clearInterval(mover);
    yesBtn.style.transform='rotate(-45deg) scale(1.2)';
  },10000);
}

yesBtn.onclick=()=>{
  if(moving) return;
  message.style.display='block';
  startFireworksShow();
};

/* -------- Fireworks -------- */
const canvas=document.getElementById('fireworks');
const ctx=canvas.getContext('2d');
const boom=document.getElementById('boomSound');
let particles=[];
let fwInt=null, sndInt=null;

function resize(){canvas.width=innerWidth;canvas.height=innerHeight}
resize(); addEventListener('resize',resize);

function burst(x,y){
  for(let i=0;i<60;i++) particles.push({x,y,a:Math.random()*6.28,s:Math.random()*5+2,l:70});
}

function step(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles.forEach((p,i)=>{
    p.x+=Math.cos(p.a)*p.s;
    p.y+=Math.sin(p.a)*p.s;
    p.s*=.96; p.l--;
    ctx.beginPath(); ctx.arc(p.x,p.y,3,0,6.28);
    ctx.fillStyle=`hsl(${Math.random()*360},100%,60%)`;
    ctx.fill();
    if(p.l<=0) particles.splice(i,1);
  });
  requestAnimationFrame(step);
}
step();

function startFireworksShow(){
  if(fwInt) return;
  fwInt=setInterval(()=>burst(Math.random()*canvas.width,Math.random()*canvas.height*.6),300);
  sndInt=setInterval(()=>{boom.currentTime=0; boom.play().catch(()=>{});},700);
  setTimeout(()=>{clearInterval(fwInt);clearInterval(sndInt);fwInt=null;sndInt=null;},20000);
}
</script>
</body>
</html>

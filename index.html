<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Propose Day 💍</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #ffdde1;
      position: relative;
    }

    /* Floating hearts background */
    .hearts {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
    }

    .heart {
      position: absolute;
      bottom: -20px;
      font-size: 24px;
      animation: floatUp linear infinite;
      opacity: 0.8;
    }

    @keyframes floatUp {
      from {
        transform: translateY(0) scale(1);
        opacity: 0.9;
      }
      to {
        transform: translateY(-110vh) scale(1.4);
        opacity: 0;
      }
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      text-align: center;
      width: 320px;
      position: relative;
      z-index: 2;
    }

    h1 {
      margin-bottom: 30px;
      color: #e91e63;
    }

    .buttons {
      position: relative;
      height: 130px;
    }

    /* Smaller Heart shaped YES button */
    #yesBtn {
      width: 70px;
      height: 70px;
      font-size: 14px;
      border: none;
      cursor: pointer;
      color: white;
      background: #ff2e63;
      position: absolute;
      left: 40px;
      top: 30px;
      transform: rotate(-45deg);
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
    }

    #yesBtn::before,
    #yesBtn::after {
      content: "";
      position: absolute;
      width: 70px;
      height: 70px;
      background: #ff2e63;
      border-radius: 50%;
    }

    #yesBtn::before {
      top: -35px;
      left: 0;
    }

    #yesBtn::after {
      left: 35px;
      top: 0;
    }

    #yesBtn span {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: rotate(45deg);
      font-weight: bold;
      z-index: 1;
    }

    #message {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
      color: #e91e63;
      display: none;
    }

    /* Fireworks canvas */
    #fireworks {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }
  </style>
</head>
<body>

  <!-- Hearts background -->
  <div class="hearts" id="hearts"></div>

  <canvas id="fireworks"></canvas>

  <!-- Firework sound -->
  <audio id="boomSound" src="https://actions.google.com/sounds/v1/explosions/fireworks.ogg" preload="auto"></audio>

  <div class="card">
    <h1>Will you be my Kanchi? ❤️</h1>
    <div class="buttons" id="btnArea">
      <button id="yesBtn"><span>Yes</span></button>
    </div>
    <div id="message">Yay!! I knew it 😍<br>I lob you too ❤️</div>
  </div>

  <script>
    /* -------- Floating Hearts -------- */
    const heartsWrap = document.getElementById('hearts');
    function makeHeart() {
      const h = document.createElement('div');
      h.className = 'heart';
      h.textContent = Math.random() > 0.5 ? '❤️' : '💖';
      h.style.left = Math.random() * 100 + 'vw';
      h.style.animationDuration = (4 + Math.random() * 4) + 's';
      h.style.fontSize = (18 + Math.random() * 22) + 'px';
      heartsWrap.appendChild(h);
      setTimeout(() => h.remove(), 8000);
    }
    setInterval(makeHeart, 300);

    const yesBtn = document.getElementById('yesBtn');
    const area = document.getElementById('btnArea');
    const message = document.getElementById('message');
    const boomSound = document.getElementById('boomSound');

    let moving = true;

    function moveYesButton() {
      if (!moving) return;

      const areaRect = area.getBoundingClientRect();
      const btnRect = yesBtn.getBoundingClientRect();

      const maxX = areaRect.width - btnRect.width;
      const maxY = areaRect.height - btnRect.height;

      const x = Math.random() * maxX;
      const y = Math.random() * maxY;

      yesBtn.style.left = x + 'px';
      yesBtn.style.top = y + 'px';
    }

    const mover = setInterval(moveYesButton, 300);

    setTimeout(() => {
      moving = false;
      clearInterval(mover);
      yesBtn.style.transform = 'rotate(-45deg) scale(1.2)';
    }, 10000);

    yesBtn.addEventListener('click', () => {
      if (moving) return;
      message.style.display = 'block';
      startFireworksShow();
    });

    /* -------- Fireworks -------- */
    const canvas = document.getElementById('fireworks');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let fireworksInterval = null;
    let soundInterval = null;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    function createFirework(x, y) {
      for (let i = 0; i < 60; i++) {
        particles.push({
          x,
          y,
          angle: Math.random() * Math.PI * 2,
          speed: Math.random() * 5 + 2,
          life: 60 + Math.random() * 20
        });
      }
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += Math.cos(p.angle) * p.speed;
        p.y += Math.sin(p.angle) * p.speed;
        p.speed *= 0.96;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function drawParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fillStyle = `hsl(${Math.random()*360},100%,60%)`;
        ctx.fill();
      });
    }

    function loop() {
      updateParticles();
      drawParticles();
      requestAnimationFrame(loop);
    }
    loop();

    function startFireworksShow() {
      if (fireworksInterval) return;

      fireworksInterval = setInterval(() => {
        const x = Math.random() * canvas.width;
        const y = Math.random() * canvas.height * 0.6;
        createFirework(x, y);
      }, 300);

      soundInterval = setInterval(() => {
        boomSound.currentTime = 0;
        boomSound.play().catch(()=>{});
      }, 700);

      setTimeout(() => {
        clearInterval(fireworksInterval);
        clearInterval(soundInterval);
        fireworksInterval = null;
        soundInterval = null;
      }, 20000);
    }
  </script>

</body>
</html>
